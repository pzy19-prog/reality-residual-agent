[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-residual-agent"
version = "0.1.0"
description = "Deterministic 2D conveyor pick-and-place residual compensation baseline"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "pydantic>=2.6,<3"]

[project.scripts]
rra = "rra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
